<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SoilCare AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="fas fa-leaf text-warning me-2 fs-4"></i>
        <span>SoilCare AI</span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="main-nav-links"></ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="custom-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
              <i class="fas fa-user-lock fs-3"></i>
            </div>
            <h3 class="fw-bold">Sign In to Your Account</h3>
            <p class="text-muted small">Access soil analysis records, dashboards, and reports</p>
          </div>

          <div id="alert-container"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                  <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3" id="loginBtn">
              <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>

            <div class="text-center text-muted small">
              Don't have an account? <a href="register.html" class="text-success fw-bold">Register here</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = Auth.isAdmin() ? 'admin-dashboard.html' : 'dashboard.html';
        return;
      }

      const togglePasswordBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
      });

      const loginForm = document.getElementById('loginForm');
      const alertContainer = document.getElementById('alert-container');
      const loginBtn = document.getElementById('loginBtn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';

        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="loading-spinner me-2"></span> Authenticating...';

        const res = await Auth.apiCall('/auth/login', 'POST', { email, password });

        if (res.success) {
          Auth.saveSession(res.token, res.user);
          alertContainer.innerHTML = `<div class="alert alert-success"><i class="fas fa-check-circle me-2"></i>Login successful! Redirecting...</div>`;
          setTimeout(() => {
            window.location.href = res.user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
          }, 800);
        } else {
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
          alertContainer.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-triangle me-2"></i>${res.message || 'Login failed.'}</div>`;
        }
      });
    });
  </script>
</body>
</html>
