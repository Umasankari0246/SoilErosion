<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="fas fa-leaf text-warning me-2 fs-4"></i>
        <span>SoilCare AI <span class="badge bg-warning text-dark fs-6 ms-2">ADMIN</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="main-nav-links"></ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
      <div>
        <h2 class="fw-bold text-success mb-1"><i class="fas fa-users-cog me-2"></i>User Account Management</h2>
        <p class="text-muted small mb-0">View registered users, search accounts, update roles, activate/deactivate, or create accounts</p>
      </div>
      <div class="mt-3 mt-md-0">
        <button class="btn btn-primary-custom shadow-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
          <i class="fas fa-user-plus me-2"></i>Add New User
        </button>
      </div>
    </div>

    <!-- Toolbar Filters -->
    <div class="custom-card p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-search text-muted"></i></span>
            <input type="text" class="form-control" id="userSearchInput" placeholder="Search by name, email, or phone...">
          </div>
        </div>

        <div class="col-md-3">
          <select class="form-select" id="filterRole">
            <option value="">All Roles</option>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="col-md-2">
          <select class="form-select" id="filterStatus">
            <option value="">All Statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div class="col-md-2 text-md-end">
          <span class="badge bg-success-subtle text-success fs-6 px-3 py-2" id="users-count-badge">0 Users</span>
        </div>
      </div>
    </div>

    <!-- Users Table -->
    <div class="custom-card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Status</th>
              <th>Registered Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr>
              <td colspan="8" class="text-center py-4"><span class="loading-spinner me-2"></span>Loading user accounts...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal: Add User -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title fw-bold"><i class="fas fa-user-plus me-2"></i>Create New User</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div id="add-user-alert"></div>
            <form id="addUserForm">
              <div class="mb-3">
                <label for="new_full_name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="new_full_name" required>
              </div>
              <div class="mb-3">
                <label for="new_email" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="new_email" required>
              </div>
              <div class="mb-3">
                <label for="new_phone" class="form-label fw-semibold">Phone</label>
                <input type="text" class="form-control" id="new_phone" required>
              </div>
              <div class="mb-3">
                <label for="new_password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="new_password" required>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="new_role" class="form-label fw-semibold">Role</label>
                  <select class="form-select" id="new_role">
                    <option value="user" selected>User</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="new_status" class="form-label fw-semibold">Status</label>
                  <select class="form-select" id="new_status">
                    <option value="active" selected>Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
              </div>
              <div class="text-end mt-3">
                <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary-custom px-4">Create User</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Edit User -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title fw-bold"><i class="fas fa-user-edit me-2"></i>Edit User Account</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="edit_user_id">
            <div class="mb-3">
              <label for="edit_full_name" class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" id="edit_full_name" required>
            </div>
            <div class="mb-3">
              <label for="edit_email" class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control" id="edit_email" required>
            </div>
            <div class="mb-3">
              <label for="edit_phone" class="form-label fw-semibold">Phone</label>
              <input type="text" class="form-control" id="edit_phone" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="edit_role" class="form-label fw-semibold">Role</label>
                <select class="form-select" id="edit_role">
                  <option value="user">User</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="edit_status" class="form-label fw-semibold">Status</label>
                <select class="form-select" id="edit_status">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="edit_password" class="form-label fw-semibold">New Password (Optional)</label>
              <input type="password" class="form-control" id="edit_password" placeholder="Leave blank to keep unchanged">
            </div>
            <div class="text-end mt-3">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="button" onclick="saveEditUser()" class="btn btn-primary-custom px-4">Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
