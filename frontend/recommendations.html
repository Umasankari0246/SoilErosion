<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conservation Recommendations - SoilCare AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="fas fa-leaf text-warning me-2 fs-4"></i>
        <span>SoilCare AI</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" id="main-nav-links"></ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="mb-4">
      <h2 class="fw-bold text-success"><i class="fas fa-seedling me-2"></i>Sustainable Soil Conservation Knowledge Base</h2>
      <p class="text-muted">Evidence-based land restoration practices, organic amendments, and erosion control measures categorized by soil degradation factors.</p>
    </div>

    <div class="row g-4" id="recommendations-catalog">
      <!-- Recommendations loaded dynamically -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('recommendations-catalog');

      const res = await Auth.apiCall('/recommendations');
      const recs = res.success ? res.recommendations : [];

      if (recs.length === 0) {
        container.innerHTML = `<div class="col-12 text-center py-5 text-muted">No recommendations found in database.</div>`;
        return;
      }

      let html = '';
      const factorIcons = {
        'Soil Erosion': 'fa-mountain',
        'Low Organic Carbon': 'fa-leaf',
        'High Salinity': 'fa-water',
        'Low Moisture': 'fa-tint-slash',
        'Nutrient Deficiency': 'fa-cubes',
        'Acidic Soil (Low pH)': 'fa-flask',
        'Alkaline Soil (High pH)': 'fa-vial'
      };

      recs.forEach(item => {
        const icon = factorIcons[item.factor] || 'fa-seedling';
        let badgeColor = 'bg-danger';
        if (item.priority === 'Medium') badgeColor = 'bg-warning text-dark';
        else if (item.priority === 'Low') badgeColor = 'bg-info text-white';

        html += `
          <div class="col-md-6 col-lg-4">
            <div class="custom-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="bg-success-subtle text-success p-3 rounded-circle">
                    <i class="fas ${icon} fs-4"></i>
                  </div>
                  <span class="badge ${badgeColor} px-3 py-1 rounded-pill">${item.priority} Priority</span>
                </div>
                <h5 class="fw-bold text-success mb-2">${item.factor}</h5>
                <p class="text-dark fs-6">${item.recommendation}</p>
              </div>
              <div class="mt-3 pt-3 border-top text-muted small">
                <i class="fas fa-check-circle me-1 text-success"></i> Recommended Agronomic Strategy
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    });
  </script>
</body>
</html>
